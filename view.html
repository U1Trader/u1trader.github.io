<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>U1Trader | Payout</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}body{display:flex;flex-direction:column;min-height:100dvh}.topbar{height:54px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 14px;background:#090909;border-bottom:1px solid #242424}.back{color:#f0cf78;text-decoration:none;font-size:15px;font-weight:700;padding:8px 10px;border:1px solid #51452b;border-radius:8px}.title{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ddd}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;background:#000}.stage img{display:block;max-width:100%;max-height:calc(100dvh - 76px);width:auto;height:auto;object-fit:contain}.stage iframe{width:100%;height:100%;border:0;background:#000}.error{color:#fff;text-align:center;padding:24px}
</style>
</head>
<body>
<header class="topbar"><a class="back" href="./#payouts">← Back</a><div class="title" id="title">U1Trader Payout</div></header>
<main class="stage" id="stage"><div class="error">Loading payout…</div></main>
<script>
const params=new URLSearchParams(location.search);
const file=params.get('file')||'';
const allowed=/^(topstep-payout-oct-2026\.jpg|fundingpips-reward-3475\.png|fundingpips-reward-4900\.png|fundingpips-all-time-rewards\.png|payout-certificate-(7593\.jpg|7593\.pdf|2360\.pdf|3227\.pdf))$/;
const stage=document.getElementById('stage');
if(!allowed.test(file)){stage.innerHTML='<div class="error">File not found. <a style="color:#f0cf78" href="./#payouts">Go back</a></div>';}
else{
 document.getElementById('title').textContent=file.replace(/[-_]/g,' ');
 if(/\.pdf$/i.test(file)){const frame=document.createElement('iframe');frame.title='Payout certificate PDF';frame.src=file;stage.replaceChildren(frame);}
 else{const img=document.createElement('img');img.alt='Payout certificate';img.src=file;stage.replaceChildren(img);}
}
</script>
</body>
</html>
