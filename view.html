<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="background-color" content="#000000">
<title>U1Trader | Payout</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}.topbar{min-height:48px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:7px 12px;background:#090909;border-bottom:1px solid #242424}.back{color:#f0cf78;text-decoration:none;font-size:14px;font-weight:700;padding:8px 10px;border:1px solid #51452b;border-radius:8px;white-space:nowrap}.title{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ddd}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;background:#000}.stage img{display:block;max-width:100%;max-height:calc(100dvh - 70px);width:auto;height:auto;object-fit:contain}.pdfwrap{width:100%;height:calc(100dvh - 70px);overflow:auto;display:flex;justify-content:center;align-items:flex-start;background:#202124;padding:8px}.pdfwrap canvas{display:block;max-width:100%;height:auto!important;background:white;box-shadow:0 2px 12px #0008}.message{color:#ddd;text-align:center;padding:24px;line-height:1.6}.message a{color:#f0cf78}.error{color:#fff;text-align:center;padding:24px}
</style>
</head>
<body>
<header class="topbar"><a class="back" href="./#payouts">← Back</a><div class="title" id="title">U1Trader Payout</div></header>
<main class="stage" id="stage"><div class="message">Loading payout…</div></main>
<script>
const params=new URLSearchParams(location.search);
const file=params.get('file')||'';
const allowed=/^(topstep-payout-oct-2026\.jpg|fundingpips-reward-3475\.png|fundingpips-reward-4900\.png|fundingpips-all-time-rewards\.png|payout-certificate-(7593\.jpg|7593\.pdf|2360\.pdf|3227\.pdf))$/;
const stage=document.getElementById('stage');
const title=document.getElementById('title');
if(!allowed.test(file)){
 stage.innerHTML='<div class="error">File not found. <a style="color:#f0cf78" href="./#payouts">Go back</a></div>';
}else{
 title.textContent=file.replace(/[-_]/g,' ');
 if(/\.pdf$/i.test(file)){
   stage.innerHTML='<div class="pdfwrap" id="pdfwrap"><div class="message">Loading PDF…</div></div>';
   const script=document.createElement('script');
   script.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
   script.onload=async()=>{
     try{
       pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
       const pdf=await pdfjsLib.getDocument({url:file}).promise;
       const wrap=document.getElementById('pdfwrap');
       wrap.replaceChildren();
       for(let pageNum=1;pageNum<=pdf.numPages;pageNum++){
         const page=await pdf.getPage(pageNum);
         const base=page.getViewport({scale:1});
         const availableWidth=Math.max(240,wrap.clientWidth-16);
         const scale=Math.min(2.2,availableWidth/base.width);
         const viewport=page.getViewport({scale});
         const canvas=document.createElement('canvas');
         const ctx=canvas.getContext('2d');
         canvas.width=Math.floor(viewport.width);
         canvas.height=Math.floor(viewport.height);
         canvas.style.margin='0 auto 12px';
         wrap.appendChild(canvas);
         await page.render({canvasContext:ctx,viewport}).promise;
       }
     }catch(e){
       document.getElementById('pdfwrap').innerHTML='<div class="message">PDF preview could not load.<br><a href="'+file+'" target="_blank" rel="noopener">Open PDF directly</a></div>';
     }
   };
   script.onerror=()=>{document.getElementById('pdfwrap').innerHTML='<div class="message">PDF preview library could not load.<br><a href="'+file+'" target="_blank" rel="noopener">Open PDF directly</a></div>';};
   document.head.appendChild(script);
 }else{
   const img=document.createElement('img');img.alt='Payout certificate';img.src=file;stage.replaceChildren(img);
 }
}
</script>
</body>
</html>
